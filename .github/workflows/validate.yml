name: validate

on:
  push:
  pull_request:

jobs:
  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/validate_repo.py
      - run: python3 -m py_compile scripts/benchmark.py scripts/validate_repo.py
